<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Project image coming soon">
  <defs>
    <radialGradient id="fogA" cx="12%" cy="88%" r="62%">
      <stop offset="0%"  stop-color="#ff1b6e" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ff1b6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogB" cx="90%" cy="90%" r="62%">
      <stop offset="0%"  stop-color="#1fe3e3" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#1fe3e3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#000000"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#fogA)"/>
  <rect width="1200" height="675" fill="url(#fogB)"/>

  <!-- HUD corners -->
  <g stroke-width="2" fill="none" opacity=".8">
    <path d="M40 96V40h56"   stroke="#ff1b6e"/>
    <path d="M1104 40h56v56" stroke="#1fe3e3"/>
    <path d="M40 579v56h56"  stroke="#ff1b6e"/>
    <path d="M1160 579v56h-56" stroke="#1fe3e3"/>
  </g>

  <!-- ring mark -->
  <g transform="translate(600 305) scale(1.5) translate(-50 -50)">
    <path d="M48 16 A34 34 0 0 0 48 84"     fill="none" stroke="#ff1b6e" stroke-width="13"/>
    <path d="M52 16 A34 34 0 0 1 81.9 38.4" fill="none" stroke="#1fe3e3" stroke-width="13"/>
    <path d="M81.9 61.6 A34 34 0 0 1 52 84" fill="none" stroke="#1fe3e3" stroke-width="13"/>
    <circle cx="50" cy="50" r="11" fill="#ff1b6e"/>
  </g>

  <text x="600" y="470" text-anchor="middle"
        font-family="Orbitron, Segoe UI, sans-serif" font-size="26"
        font-weight="700" letter-spacing="9" fill="#656b7e">
    PROJECT IMAGE
  </text>
</svg>
